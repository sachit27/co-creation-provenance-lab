version: '3.9'

# Co-Creation Provenance Lab — Docker Compose
#
# Starts two services:
#   bge-m3    — Python/Flask embedding server (downloads ~2 GB model on first run)
#   frontend  — Vite dev server (hot-reload)
#
# Usage:
#   docker compose up
#
# The frontend will be available at http://localhost:5173
# The BGE-M3 embedding server will be at http://localhost:5001

services:

  # ─── BGE-M3 Embedding Server ──────────────────────────────────────────────
  bge-m3:
    image: python:3.11-slim
    container_name: cprov-bge-m3
    working_dir: /app
    volumes:
      - ./embedding_server.py:/app/embedding_server.py:ro
      - ./requirements-embedding.txt:/app/requirements-embedding.txt:ro
      - bge_model_cache:/root/.cache
    command: >
      bash -c "
        pip install --quiet --no-cache-dir -r requirements-embedding.txt &&
        python embedding_server.py
      "
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - TRANSFORMERS_CACHE=/root/.cache
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/sentence_transformers
      - BGE_BIND_HOST=0.0.0.0
      - BGE_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s   # first run downloads the model

  # ─── Frontend Dev Server ──────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: cprov-frontend
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      # Local development UI; avoid exposing Vite to the surrounding network.
      - "127.0.0.1:5173:5173"
    environment:
      # This value is evaluated by the host browser, not inside Compose DNS.
      - VITE_BGE_M3_URL=http://localhost:5001
    depends_on:
      bge-m3:
        condition: service_healthy

volumes:
  bge_model_cache:
  node_modules_cache:
